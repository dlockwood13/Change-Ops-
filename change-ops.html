<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0B1220" />
<meta name="description" content="Change-Ops: assess, prioritise and critique business change. Weighted gate verdicts, ownership model recommendations, a tracked pipeline and portfolio patterns." />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Change-Ops" />
<title>Change-Ops · assess, prioritise, critique business change</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0B1220; --surface:#121C2E; --surface-2:#1A2740; --raised:#22324E;
    --line:#24344F; --line-2:#2F436B; --line-soft:#1E2C45;
    --ink:#E8EEF7; --ink-2:#C5D2E6; --muted:#8DA2C0; --faint:#5E718E;
    --teal:#2DD4BF; --teal-deep:#14B8A6; --teal-dim:#0E3B38;
    --proceed:#34D399; --proceed-bg:#0F3328;
    --caution:#FBBF24; --caution-bg:#3A2E0B;
    --hold:#FB923C; --hold-bg:#3A220C;
    --reject:#F87171; --reject-bg:#3A1517;
    --info:#56B0F4; --info-bg:#0F2A45;
    --radius:14px; --radius-sm:9px;
    --shadow:0 1px 0 rgba(255,255,255,.03), 0 14px 40px -18px rgba(0,0,0,.7);
    --mono:"Space Grotesk", ui-monospace, monospace;
    --disp:"Space Grotesk", system-ui, sans-serif;
    --body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  body{min-height:100vh}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit}
  a{color:var(--teal)}
  ::selection{background:rgba(45,212,191,.25)}
  .app{display:grid;grid-template-columns:228px 1fr;min-height:100vh}
  @media (max-width:880px){ .app{grid-template-columns:1fr} .rail{display:none} }

  /* ---------- Rail ---------- */
  .rail{background:linear-gradient(180deg,#0C1424,#0A111F);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px;gap:6px}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
  .brand .mark{width:30px;height:30px;border-radius:8px;background:radial-gradient(circle at 30% 30%,var(--teal),var(--teal-deep) 60%,#0A6157);display:flex;align-items:center;justify-content:center;color:#05201C;font-family:var(--disp);font-weight:700;font-size:15px;box-shadow:0 0 18px rgba(45,212,191,.35)}
  .brand h1{font-family:var(--disp);font-size:17px;font-weight:700;letter-spacing:.02em;margin:0}
  .brand small{display:block;color:var(--faint);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
  .nav-btn{display:flex;align-items:center;gap:10px;width:100%;border:1px solid transparent;background:transparent;color:var(--muted);font-size:13.5px;font-weight:500;padding:10px 12px;border-radius:10px;text-align:left;transition:all .15s}
  .nav-btn:hover{color:var(--ink);background:var(--surface)}
  .nav-btn.on{color:var(--teal);background:var(--teal-dim);border-color:rgba(45,212,191,.25)}
  .nav-btn .k{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint);background:var(--surface);border:1px solid var(--line-soft);border-radius:5px;padding:1px 6px}
  .rail .spacer{flex:1}
  .rail-foot{border-top:1px solid var(--line-soft);padding-top:12px;display:flex;flex-direction:column;gap:8px}
  .rail-foot .meta{font-size:10.5px;color:var(--faint);line-height:1.5;padding:0 4px}
  .rail-foot .meta b{color:var(--muted);font-weight:600}

  /* ---------- Topbar (mobile) ---------- */
  .topbar{display:none}
  @media (max-width:880px){
    .topbar{display:flex;position:sticky;top:0;z-index:40;background:rgba(11,18,32,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 12px;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
    .topbar::-webkit-scrollbar{display:none}
    .topbar .mark{width:26px;height:26px;border-radius:7px;background:radial-gradient(circle at 30% 30%,var(--teal),var(--teal-deep));display:flex;align-items:center;justify-content:center;color:#05201C;font-family:var(--disp);font-weight:700;font-size:13px;flex:0 0 auto}
    .topbar .tb{flex:0 0 auto;border:1px solid var(--line-soft);background:var(--surface);color:var(--muted);font-size:12px;font-weight:500;padding:7px 12px;border-radius:999px}
    .topbar .tb.on{color:var(--teal);background:var(--teal-dim);border-color:rgba(45,212,191,.3)}
  }

  /* ---------- Main ---------- */
  .main{padding:26px 30px 70px;max-width:1060px;width:100%;margin:0 auto;min-width:0}
  @media (max-width:880px){ .main{padding:18px 14px 70px} }
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
  .page-head h2{font-family:var(--disp);font-size:22px;font-weight:700;margin:0;letter-spacing:.01em}
  .page-head p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:640px;line-height:1.5}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);font-weight:600;margin-bottom:6px}

  /* ---------- Cards / layout ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-soft)}
  .card-h h3{margin:0;font-family:var(--disp);font-size:14px;font-weight:600;letter-spacing:.02em}
  .card-h .block-tag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
  .card-b{padding:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media (max-width:760px){ .grid2,.grid3{grid-template-columns:1fr} }
  .stack{display:flex;flex-direction:column;gap:14px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  /* ---------- Inputs ---------- */
  label.f-label{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  .f-input,.f-area,.f-select{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);color:var(--ink);font-size:13.5px;padding:9px 11px;outline:none;transition:border-color .15s}
  .f-input:focus,.f-area:focus,.f-select:focus{border-color:var(--teal)}
  .f-area{resize:vertical;min-height:64px;line-height:1.5}
  .f-hint{font-size:11px;color:var(--faint);margin-top:5px;line-height:1.45}

  /* sliders */
  .dim{padding:10px 0;border-bottom:1px dashed var(--line-soft)}
  .dim:last-child{border-bottom:0}
  .dim-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
  .dim-top b{font-size:13px;font-weight:600;color:var(--ink-2)}
  .dim-top .val{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--teal)}
  .dim-top .w{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:6px}
  .dim p{margin:0 0 7px;font-size:11.5px;color:var(--faint);line-height:1.45}
  input[type=range]{width:100%;height:24px;appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--reject),var(--caution) 45%,var(--proceed))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:var(--ink);border:3px solid var(--bg);margin-top:-6px;box-shadow:0 0 0 1.5px var(--line-2)}
  input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--reject),var(--caution) 45%,var(--proceed))}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid var(--bg)}

  /* likert */
  .lik{display:flex;gap:5px}
  .lik button{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;color:var(--faint);font-family:var(--mono);font-size:12px;font-weight:600;padding:7px 0;transition:all .12s}
  .lik button:hover{border-color:var(--line-2);color:var(--muted)}
  .lik button.on{background:var(--teal-dim);border-color:rgba(45,212,191,.45);color:var(--teal)}
  .lik-row{padding:9px 0;border-bottom:1px dashed var(--line-soft)}
  .lik-row:last-child{border-bottom:0}
  .lik-row p{margin:0 0 7px;font-size:12.5px;color:var(--ink-2);line-height:1.45}

  /* signal tri-state */
  .sig{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line-soft);flex-wrap:wrap}
  .sig:last-child{border-bottom:0}
  .sig .q{flex:1 1 240px;font-size:12.5px;color:var(--ink-2);line-height:1.45}
  .sig .q small{display:block;color:var(--faint);font-size:10.5px;margin-top:2px}
  .sig .rel{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--faint);border:1px solid var(--line-soft);border-radius:5px;padding:2px 6px;text-transform:uppercase}
  .tri{display:flex;gap:4px}
  .tri button{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;color:var(--faint);font-size:11px;font-weight:600;padding:6px 9px;transition:all .12s}
  .tri button.pos.on{background:var(--proceed-bg);border-color:rgba(52,211,153,.4);color:var(--proceed)}
  .tri button.neu.on{background:var(--surface);border-color:var(--line-2);color:var(--ink-2)}
  .tri button.con.on{background:var(--reject-bg);border-color:rgba(248,113,113,.4);color:var(--reject)}

  /* flags */
  .flag{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border:1px solid var(--line-soft);border-radius:var(--radius-sm);background:var(--surface-2);cursor:pointer;transition:all .12s}
  .flag:hover{border-color:var(--line-2)}
  .flag.on{background:var(--reject-bg);border-color:rgba(248,113,113,.4)}
  .flag input{margin-top:2px;accent-color:var(--reject)}
  .flag span{font-size:12.5px;color:var(--ink-2);line-height:1.4}
  .flag.on span{color:#FECACA}

  /* ---------- Verdict panel (signature) ---------- */
  .verdict{border-radius:var(--radius);border:1px solid var(--line);overflow:hidden;position:sticky;top:18px}
  @media (max-width:1023px){ .verdict{position:static} }
  .v-head{padding:18px 18px 14px;border-bottom:1px solid var(--line-soft);background:linear-gradient(180deg,var(--surface-2),var(--surface))}
  .v-gate{font-family:var(--disp);font-weight:700;font-size:30px;letter-spacing:.06em;line-height:1;display:flex;align-items:center;gap:10px}
  .v-gate .lamp{width:13px;height:13px;border-radius:50%;box-shadow:0 0 14px currentColor}
  .v-sub{margin:8px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5}
  .v-PROCEED .v-gate{color:var(--proceed)} .v-PROCEED .v-head{background:linear-gradient(180deg,var(--proceed-bg),var(--surface))}
  .v-CAUTION .v-gate{color:var(--caution)} .v-CAUTION .v-head{background:linear-gradient(180deg,var(--caution-bg),var(--surface))}
  .v-HOLD .v-gate{color:var(--hold)} .v-HOLD .v-head{background:linear-gradient(180deg,var(--hold-bg),var(--surface))}
  .v-REJECT .v-gate{color:var(--reject)} .v-REJECT .v-head{background:linear-gradient(180deg,var(--reject-bg),var(--surface))}
  .v-body{padding:14px 18px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
  .v-score{display:flex;align-items:center;gap:14px}
  .dial{position:relative;width:88px;height:88px;flex:0 0 auto}
  .dial svg{transform:rotate(-90deg)}
  .dial .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .dial .num b{font-family:var(--mono);font-size:21px;font-weight:700;line-height:1}
  .dial .num small{font-size:9px;color:var(--faint);letter-spacing:.1em;margin-top:2px}
  .v-rows{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
  .v-row{display:flex;justify-content:space-between;gap:10px;font-size:12px}
  .v-row span{color:var(--faint)}
  .v-row b{font-family:var(--mono);font-weight:600;color:var(--ink-2);text-align:right}
  .v-band{font-size:11px;color:var(--faint);line-height:1.55;border-top:1px dashed var(--line-soft);padding-top:10px}
  .v-band b{color:var(--muted)}

  /* model rec */
  .model-rec{border:1px solid rgba(45,212,191,.3);background:var(--teal-dim);border-radius:var(--radius-sm);padding:12px 13px}
  .model-rec .mr-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .model-rec .mr-chip{font-family:var(--mono);font-weight:700;font-size:12px;color:#05201C;background:var(--teal);border-radius:6px;padding:2px 8px}
  .model-rec b{font-family:var(--disp);font-size:14px;color:var(--teal)}
  .model-rec p{margin:0;font-size:11.5px;color:var(--ink-2);line-height:1.5}

  /* tier */
  .tier{border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;line-height:1.5;border:1px solid}
  .tier b{display:block;font-family:var(--disp);font-size:13px;margin-bottom:2px}
  .tier.high{background:var(--proceed-bg);border-color:rgba(52,211,153,.35);color:#A7F3D0}
  .tier.mixed{background:var(--caution-bg);border-color:rgba(251,191,36,.35);color:#FDE68A}
  .tier.susp{background:var(--reject-bg);border-color:rgba(248,113,113,.35);color:#FECACA}

  /* ---------- Buttons / chips ---------- */
  .btn{border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2);font-size:13px;font-weight:600;padding:9px 14px;border-radius:10px;transition:all .15s;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:var(--teal);color:var(--ink)}
  .btn.primary{background:var(--teal);border-color:var(--teal);color:#05201C}
  .btn.primary:hover{background:var(--teal-deep);border-color:var(--teal-deep);color:#04211D}
  .btn.danger{border-color:rgba(248,113,113,.4);color:var(--reject);background:transparent}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
  .btn.ghost:hover{color:var(--ink);border-color:var(--line-soft)}
  .btn.sm{font-size:12px;padding:6px 10px;border-radius:8px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px;border:1px solid}
  .chip.proceed{color:var(--proceed);border-color:rgba(52,211,153,.4);background:var(--proceed-bg)}
  .chip.caution{color:var(--caution);border-color:rgba(251,191,36,.4);background:var(--caution-bg)}
  .chip.hold{color:var(--hold);border-color:rgba(251,146,60,.4);background:var(--hold-bg)}
  .chip.reject{color:var(--reject);border-color:rgba(248,113,113,.4);background:var(--reject-bg)}
  .chip.neutral{color:var(--muted);border-color:var(--line-2);background:var(--surface-2)}
  .chip.teal{color:var(--teal);border-color:rgba(45,212,191,.4);background:var(--teal-dim)}

  /* archetype picker */
  .arch{display:flex;flex-wrap:wrap;gap:7px}
  .arch button{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:999px;font-size:12px;font-weight:500;padding:6px 12px;transition:all .12s}
  .arch button.on{background:var(--teal-dim);border-color:rgba(45,212,191,.45);color:var(--teal);font-weight:600}
  .arch-hint{font-size:11px;color:var(--faint);margin-top:7px;line-height:1.5}
  .arch-hint b{color:var(--teal);font-weight:600}

  /* ---------- Pipeline table ---------- */
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line)}
  .tbl td{padding:11px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  .tbl tr:last-child td{border-bottom:0}
  .tbl tr.click{cursor:pointer;transition:background .12s}
  .tbl tr.click:hover{background:var(--surface-2)}
  .tbl .t-name{font-weight:600;color:var(--ink)}
  .tbl .t-name small{display:block;font-weight:400;color:var(--faint);font-size:11px;margin-top:2px}
  .tbl .t-score{font-family:var(--mono);font-weight:700;font-size:14px}
  .tbl .t-num{font-family:var(--mono);color:var(--faint);font-size:11px}
  .status-sel{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;color:var(--ink-2);font-size:12px;padding:5px 7px;outline:none}
  .status-sel:focus{border-color:var(--teal)}
  .funnel{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .fn{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 13px;min-width:86px}
  .fn b{display:block;font-family:var(--mono);font-size:19px;font-weight:700;color:var(--ink)}
  .fn span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .fn.hot b{color:var(--teal)}
  .empty{padding:40px 20px;text-align:center;color:var(--faint);font-size:13px;line-height:1.6}
  .empty b{color:var(--muted)}

  /* ---------- Patterns ---------- */
  .stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px}
  .stat b{display:block;font-family:var(--mono);font-size:20px;font-weight:700}
  .stat span{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .bar-row{display:flex;align-items:center;gap:10px;padding:7px 0}
  .bar-row .lab{flex:0 0 150px;font-size:12px;color:var(--ink-2)}
  .bar-row .bar{flex:1;height:9px;background:var(--surface-2);border-radius:5px;overflow:hidden}
  .bar-row .bar i{display:block;height:100%;border-radius:5px;background:var(--teal)}
  .bar-row .n{flex:0 0 60px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--muted)}
  .reco{display:flex;gap:11px;padding:11px 0;border-bottom:1px dashed var(--line-soft)}
  .reco:last-child{border-bottom:0}
  .reco .imp{flex:0 0 auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;font-weight:700;border-radius:5px;padding:3px 7px;height:fit-content}
  .reco .imp.hi{background:var(--reject-bg);color:var(--reject)}
  .reco .imp.med{background:var(--caution-bg);color:var(--caution)}
  .reco .imp.lo{background:var(--info-bg);color:var(--info)}
  .reco div p{margin:0;font-size:13px;color:var(--ink-2);font-weight:600}
  .reco div small{display:block;margin-top:3px;font-size:11.5px;color:var(--faint);line-height:1.5}

  /* ---------- Method ---------- */
  .method p{font-size:13.5px;line-height:1.65;color:var(--ink-2);margin:0 0 12px}
  .method h4{font-family:var(--disp);font-size:13px;margin:18px 0 8px;color:var(--teal);letter-spacing:.04em;text-transform:uppercase}
  .method table{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0 14px}
  .method th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:7px 9px;border-bottom:1px solid var(--line)}
  .method td{padding:8px 9px;border-bottom:1px solid var(--line-soft);color:var(--ink-2);line-height:1.5;vertical-align:top}
  .rule-list{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2);line-height:1.7}

  /* gaps */
  .gap-item{border:1px solid var(--line-soft);border-radius:var(--radius-sm);background:var(--surface-2);padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .gap-item .g-top{display:flex;gap:8px;align-items:center}
  .gap-item input.f-input{flex:1}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--raised);border:1px solid var(--line-2);color:var(--ink);font-size:13px;font-weight:500;padding:11px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:90;animation:toastIn .2s ease}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
  @media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }
  .install-hint{border:1px dashed rgba(45,212,191,.35);background:var(--teal-dim);color:var(--teal);font-size:11.5px;border-radius:9px;padding:8px 10px;text-align:left;line-height:1.4;width:100%}

<body>
<div id="root"></div>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel" data-presets="react">
/* ============================================================
   ENGINE: canonical states, archetypes, scoring, SIMPLIFY logic
   Mirrors career-ops modes/_shared.md + oferta.md, retargeted.
   ============================================================ */

const STATUSES = [
  { id:"assessed", label:"Assessed",    group:"pending",  desc:"Assessed with report, pending decision" },
  { id:"proposed", label:"Proposed",    group:"positive", desc:"Business case submitted to governance" },
  { id:"endorsed", label:"Endorsed",    group:"positive", desc:"Sponsor and decision forum have backed it" },
  { id:"delivery", label:"In Delivery", group:"positive", desc:"Active delivery" },
  { id:"embedded", label:"Embedded",    group:"positive", desc:"Live, benefits being realised" },
  { id:"rejected", label:"Rejected",    group:"negative", desc:"Rejected by governance" },
  { id:"parked",   label:"Parked",      group:"negative", desc:"Shelved or withdrawn by the owner" },
  { id:"skip",     label:"SKIP",        group:"self",     desc:"Does not fit, do not pursue" }
];
const STATUS_BY_ID = Object.fromEntries(STATUSES.map(s => [s.id, s]));

const ARCHETYPES = [
  { id:"process", label:"Process improvement",        sig:["cycle time","handoff","handoffs","waste","rework","standardise","lean","queue"] },
  { id:"tech",    label:"Technology implementation",  sig:["system","platform","migration","integration","rollout","decommission","crm","catalogue","cpq"] },
  { id:"org",     label:"Organisation redesign",      sig:["operating model","restructure","spans","layers","roles","consultation","tupe"] },
  { id:"reg",     label:"Regulatory and compliance",  sig:["regulator","mandate","deadline","audit","compliance","licence","ofcom","fca"] },
  { id:"prop",    label:"Proposition launch",         sig:["launch","customer","market","revenue","proposition","pricing","segment"] },
  { id:"wow",     label:"Ways of working",            sig:["adoption","behaviours","capability","enablement","agile","training","champions"] }
];

function detectArchetype(text){
  const t = (text || "").toLowerCase();
  const scored = ARCHETYPES.map(a => ({
    id: a.id, label: a.label,
    hits: a.sig.reduce((n, s) => n + (t.includes(s) ? 1 : 0), 0)
  })).sort((x, y) => y.hits - x.hits);
  const primary = scored[0].hits > 0 ? scored[0] : null;
  const secondary = scored[1].hits >= 2 ? scored[1] : null;
  return { primary, secondary };
}

/* ---- Scoring dimensions (weighted 1-5, mirrors the 6-block scheme) ---- */
const DIMS = [
  { id:"strategy",   label:"Strategic fit",     w:0.24, hint:"Alignment to strategy and the target operating model. The North Star test: would we invent this if it did not already exist?" },
  { id:"capability", label:"Capability match",  w:0.22, hint:"Skills, capacity and technology to deliver, mapped to evidence, not optimism." },
  { id:"benefits",   label:"Benefits case",     w:0.22, hint:"Value against cost. 5 is a top-quartile return with a named baseline, 1 is well below the line." },
  { id:"readiness",  label:"Readiness signals", w:0.18, hint:"Sponsorship, change appetite, frontline capacity to absorb it." },
  { id:"risk",       label:"Risk posture",      w:0.14, hint:"5 is well-understood and contained, 1 is unbounded. Red flags below subtract on top." }
];

const RED_FLAGS = [
  { id:"nobaseline", label:"No baseline measures exist for the benefits claimed" },
  { id:"external",   label:"Outcome depends on a supplier or system outside our control" },
  { id:"frontline",  label:"Frontline teams would be hearing about this here first" },
  { id:"sponsorchurn", label:"Sponsor has changed in the last two quarters" },
  { id:"doublecount", label:"Benefits are double-counted with another initiative" },
  { id:"datefirst",  label:"Delivery date was fixed before scope was shaped" }
];
const FLAG_PENALTY = 0.15;

/* ---- Gate verdicts (score interpretation, faithful to the 1-5 bands) ---- */
const VERDICTS = {
  PROCEED: { label:"PROCEED", cls:"proceed", sub:"Strong case. Mobilise now and protect it from scope drift." },
  CAUTION: { label:"CAUTION", cls:"caution", sub:"Good case, proceed with conditions. Close the named gaps before committing the full envelope." },
  HOLD:    { label:"HOLD",    cls:"hold",    sub:"Decent but not ready. Pursue only with a specific reason, otherwise reshape and reassess." },
  REJECT:  { label:"REJECT",  cls:"reject",  sub:"Recommend against in current form. Log it, keep the analysis, spend the capacity elsewhere." }
};
function verdictFor(global){
  if (global >= 4.5) return VERDICTS.PROCEED;
  if (global >= 4.0) return VERDICTS.CAUTION;
  if (global >= 3.5) return VERDICTS.HOLD;
  return VERDICTS.REJECT;
}

/* ---- Readiness sub-assessment (SIMPLIFY ownership logic) ----
   Eight 0-4 statements. Six place the capability (Independent /
   Central-new / Central-legacy, models a/b/c), two measure raw
   readiness to proceed this cycle. */
const READINESS_QS = [
  { id:"diff",   q:"The capability is differentiating for this unit, not a commodity" },
  { id:"reuse",  q:"Other units need substantially the same capability" },
  { id:"legacy", q:"It is deeply entangled with the legacy core estate" },
  { id:"data",   q:"It is tightly coupled to systems of record for its data" },
  { id:"pace",   q:"The pace required exceeds the central delivery cadence" },
  { id:"skills", q:"The unit has the skills and appetite to own it end to end" },
  { id:"fund",   q:"Funding and people are actually available this cycle" },
  { id:"clear",  q:"Scope and success measures are written down and agreed" }
];

const MODELS = {
  independent: { ownership:"Independent",    model:"a", blurb:"Unit-owned build or buy. Differentiating, loosely coupled, and the unit can run at its own pace. Guard rails: published interfaces and no quiet forks of master data." },
  centralNew:  { ownership:"Central-new",    model:"b", blurb:"Build once on the new central stack and expose it to every unit. The reuse case outweighs local speed. Guard rails: a real product owner and a roadmap units can see." },
  centralLegacy:{ ownership:"Central-legacy", model:"c", blurb:"Extend or configure the existing core system. Entanglement makes a parallel build a migration project in disguise. Guard rails: strangler-pattern boundaries and an exit criterion." }
};

function recommendModel(r){
  const g = k => Math.max(0, Math.min(4, Number(r && r[k]) || 0));
  const diff = g("diff"), reuse = g("reuse"), legacy = g("legacy"),
        data = g("data"), pace = g("pace"), skills = g("skills");
  const entangle = (legacy + data) / 2;
  const scores = {
    independent:  diff * 1.0 + pace * 0.8 + skills * 1.0 - entangle * 1.2 - reuse * 0.5,
    centralNew:   reuse * 1.6 + (4 - entangle) * 0.6 + pace * 0.2 - diff * 0.4,
    centralLegacy: entangle * 1.7 + (4 - diff) * 0.5 + (4 - pace) * 0.4 - skills * 0.2
  };
  const ranked = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const key = ranked[0][0];
  const why = {
    independent:  "Driven by differentiation " + diff + "/4, pace " + pace + "/4 and unit skills " + skills + "/4 against entanglement " + entangle.toFixed(1) + "/4.",
    centralNew:   "Driven by cross-unit reuse " + reuse + "/4 with manageable entanglement " + entangle.toFixed(1) + "/4.",
    centralLegacy: "Driven by entanglement " + entangle.toFixed(1) + "/4 and low differentiation " + diff + "/4. A parallel build here is a migration in disguise."
  };
  return Object.assign({}, MODELS[key], { why: why[key], scores });
}

function readinessPct(r){
  const g = k => Math.max(0, Math.min(4, Number(r && r[k]) || 0));
  return Math.round(100 * (g("skills") + g("fund") + g("clear")) / 12);
}

/* ---- Block G: initiative legitimacy (separate from the score) ---- */
const G_SIGNALS = [
  { id:"sponsor",   q:"Named accountable sponsor with budget authority",                 rel:"High", note:"Direct observable fact" },
  { id:"funding",   q:"Funding secured this cycle, not aspirational",                    rel:"High", note:"Check the ledger, not the deck" },
  { id:"problem",   q:"Specific, measurable problem statement",                          rel:"Med",  note:"Vagueness correlates with zombie change, but also with early discovery" },
  { id:"bowner",    q:"Benefits owner named and signed up",                              rel:"Med",  note:"Benefits without an owner rarely survive year one" },
  { id:"relaunch",  q:"No history of relaunches under new names",                        rel:"Med",  note:"Two or more relaunches in recent memory is concerning" },
  { id:"collision", q:"No collision with live change on the same estate or teams",       rel:"Med",  note:"Consider sequencing before assuming conflict" },
  { id:"governance",q:"Decision forum and route to approval are defined",                rel:"Low",  note:"Subjective in younger organisations" },
  { id:"urgency",   q:"Urgency is tied to a dated trigger, not vibes",                   rel:"Low",  note:"Regulatory work is legitimately urgent without feeling it" }
];
const REL_W = { High:3, Med:2, Low:1 };
const TIERS = {
  high:  { label:"High Confidence",       cls:"high",  sub:"Most signals positive. Treat as a real, active piece of change." },
  mixed: { label:"Proceed with Caution",  cls:"mixed", sub:"Mixed signals worth noting. Observations, not accusations: every signal has legitimate explanations." },
  susp:  { label:"Suspicious",            cls:"susp",  sub:"Multiple zombie-change indicators. Investigate before investing delivery capacity." }
};
function tierFrom(sigs){
  let net = 0, answered = 0;
  for (const s of G_SIGNALS){
    const v = sigs ? Number(sigs[s.id]) || 0 : 0; // 1 positive, 0 neutral, -1 concerning
    if (sigs && sigs[s.id] !== undefined && sigs[s.id] !== null) answered++;
    net += REL_W[s.rel] * v;
  }
  const t = net >= 6 ? TIERS.high : (net <= -4 ? TIERS.susp : TIERS.mixed);
  return Object.assign({ net, answered }, t);
}

/* ---- Per-initiative metrics ---- */
function metrics(c){
  const dims = c.dims || {};
  let weighted = 0;
  const parts = DIMS.map(d => {
    const v = Math.max(1, Math.min(5, Number(dims[d.id]) || 3));
    weighted += d.w * v;
    return { id: d.id, label: d.label, v, w: d.w };
  });
  const flags = (c.flags || []).length;
  const global = Math.max(1, Math.min(5, weighted - FLAG_PENALTY * flags));
  const verdict = verdictFor(global);
  const riskDim = Math.max(1, Math.min(5, Number(dims.risk) || 3));
  const riskFactor = Math.max(0, Math.min(1, ((5 - riskDim) / 4) * 0.7 + Math.min(flags, 4) / 4 * 0.3));
  const priority = Math.round(global * 20 * (1 - 0.35 * riskFactor));
  const rec = recommendModel(c.read);
  const readiness100 = readinessPct(c.read);
  const tier = tierFrom(c.sigs);
  return { parts, flags, global, verdict, riskFactor, priority, rec, readiness100, tier };
}

/* ---- Outcome classification (patterns) ---- */
function outcomeOf(statusId){
  const g = (STATUS_BY_ID[statusId] || {}).group;
  if (g === "positive") return "positive";
  if (g === "negative") return "negative";
  if (g === "self") return "self";
  return "pending";
}

function analysePatterns(list){
  const progressed = list.filter(c => c.status !== "assessed");
  if (progressed.length < 5) return { short: progressed.length, need: 5 };
  const withM = list.map(c => ({ c, m: metrics(c), out: outcomeOf(c.status) }));
  const funnel = STATUSES.map(s => ({ s, n: list.filter(c => c.status === s.id).length }));
  const groups = ["positive", "negative", "self", "pending"];
  const scoreComparison = groups.map(gr => {
    const xs = withM.filter(x => x.out === gr).map(x => x.m.global);
    if (!xs.length) return { gr, n: 0 };
    return { gr, n: xs.length, avg: xs.reduce((a, b) => a + b, 0) / xs.length, min: Math.min(...xs), max: Math.max(...xs) };
  });
  const archRows = ARCHETYPES.map(a => {
    const xs = withM.filter(x => (x.c.archetype || "") === a.id);
    const pos = xs.filter(x => x.out === "positive").length;
    const done = xs.filter(x => x.out !== "pending").length;
    return { a, total: xs.length, pos, conv: done ? Math.round(100 * pos / done) : null };
  }).filter(r => r.total > 0).sort((x, y) => (y.conv ?? -1) - (x.conv ?? -1));
  const flagRows = RED_FLAGS.map(f => ({
    f, n: list.filter(c => (c.flags || []).includes(f.id)).length
  })).filter(r => r.n > 0).sort((x, y) => y.n - x.n);
  const posScores = withM.filter(x => x.out === "positive").map(x => x.m.global);
  const floor = posScores.length >= 2 ? Math.min(...posScores) : null;
  const recs = [];
  for (const r of archRows){
    if (r.conv === 0 && r.total >= 2) recs.push({ imp:"hi", p:"Stop assessing raw " + r.a.label.toLowerCase() + " intakes, or reshape them first", s: r.total + " assessed, none progressed to a positive outcome. The pattern says the shaping is failing before governance does." });
  }
  if (floor !== null) recs.push({ imp:"med", p:"Treat " + floor.toFixed(1) + "/5 as your evidence-based score floor", s:"No initiative below this score has reached a positive outcome in your own data. Below the floor, reshape rather than propose." });
  const topFlag = flagRows[0];
  if (topFlag && topFlag.n >= Math.max(2, Math.ceil(list.length * 0.3))) recs.push({ imp:"hi", p:"Attack your most common red flag: " + topFlag.f.label.toLowerCase(), s:"Present on " + topFlag.n + " of " + list.length + " initiatives. Fixing the intake template is cheaper than fixing every case." });
  const gateBreaks = withM.filter(x => x.out === "positive" && (x.m.verdict.label === "HOLD" || x.m.verdict.label === "REJECT")).length;
  if (gateBreaks > 0) recs.push({ imp:"med", p:"Respect your own gate", s: gateBreaks + " initiative(s) progressed despite a HOLD or REJECT verdict. Either the gate is miscalibrated or it is being overridden; decide which on purpose." });
  const skips = withM.filter(x => x.out === "self").length;
  if (skips >= Math.ceil(list.length * 0.4)) recs.push({ imp:"lo", p:"Tighten intake upstream", s: skips + " of " + list.length + " were self-filtered after a full assessment. A two-question pre-screen would save that effort." });
  if (!recs.length) recs.push({ imp:"lo", p:"No strong pattern yet", s:"Outcomes are spread evenly. Keep logging; patterns sharpen quickly after ten or so decided cases." });
  return { total: list.length, progressed: progressed.length, funnel, scoreComparison, archRows, flagRows, floor, recs };
}

/* ============================================================
   PERSISTENCE: storage wrapper with in-memory fallback,
   so the file also previews where localStorage is sandboxed.
   ============================================================ */
const store = {
  ok: (() => { try { const k = "__co_t"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return true; } catch (e) { return false; } })(),
  mem: {},
  get(k, fallback){
    if (this.ok){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
    return (k in this.mem) ? this.mem[k] : fallback;
  },
  set(k, v){
    if (this.ok){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    else this.mem[k] = v;
  }
};
const LS_KEY = "change-ops:v1";
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const today = () => new Date().toISOString().slice(0, 10);

function blankInitiative(num){
  return {
    id: uid(), num, name: "", sponsor: "", area: "", driver: "fix",
    horizon: "quarter", summary: "", archetype: "", archetype2: "",
    dims: { strategy: 3, capability: 3, benefits: 3, readiness: 3, risk: 3 },
    flags: [], gaps: [],
    read: { diff: 2, reuse: 2, legacy: 2, data: 2, pace: 2, skills: 2, fund: 2, clear: 2 },
    sigs: {}, notes: "", status: "assessed", created: today(), updated: today()
  };
}

/* ---- Seed cases (verified against the engine) ---- */
function seed(){

    mk({
      num: 1, name: "Product Catalogue Consolidation", sponsor: "Dir. Commercial Ops", area: "Business unit", driver: "grow", horizon: "quarter",

      archetype: "tech", archetype2: "prop",

      gaps: [

      ],
      read: { diff: 4, reuse: 1, legacy: 1, data: 1, pace: 3, skills: 3, fund: 3, clear: 3 },

    }),
    mk({
      num: 2, name: "CPQ Replacement", sponsor: "Group CIO", area: "Cross-unit", driver: "save", horizon: "year",
      summary: "Replace the configure-price-quote system used by every unit. High reuse across the group, moderate entanglement with billing, central delivery cadence acceptable.",
      archetype: "tech", archetype2: "",
      dims: { strategy: 4.2, capability: 3.8, benefits: 4.4, readiness: 3.9, risk: 3.6 },
      flags: [],
      gaps: [
        { req: "Unit-level requirements baseline", plan: "Run a four-week cross-unit discovery before vendor shortlisting", blocker: false },
        { req: "Billing integration capacity", plan: "Book the billing platform team's Q3 capacity now, it is the constraint", blocker: true }
      ],
      read: { diff: 1, reuse: 4, legacy: 2, data: 2, pace: 2, skills: 2, fund: 2, clear: 3 },
      sigs: { sponsor: 1, funding: 0, problem: 1, bowner: 0, relaunch: -1, collision: 0, governance: 1, urgency: 0 },
      notes: "Second relaunch attempt under a new name. The case is real but the history wants explaining in the proposal.",
      status: "assessed"
    }),
    mk({
      num: 3, name: "Excalibur CRM Decommission", sponsor: "TBC", area: "Group", driver: "save", horizon: "multi-year",
      summary: "Decommission the legacy Excalibur CRM and migrate records to the strategic platform. Deep entanglement with systems of record, low differentiation, pace constrained by data migration.",
      archetype: "tech", archetype2: "",
      dims: { strategy: 4.0, capability: 3.5, benefits: 4.2, readiness: 3.4, risk: 3.0 },
      flags: ["nobaseline"],
      gaps: [
        { req: "Named sponsor with budget authority", plan: "Escalate to the portfolio board, no sponsor means no proposal", blocker: true },
        { req: "Data migration dry-run environment", plan: "Cost a synthetic-data rehearsal into the discovery phase", blocker: false }
      ],
      read: { diff: 0, reuse: 2, legacy: 4, data: 4, pace: 1, skills: 1, fund: 1, clear: 2 },
      sigs: { sponsor: 0, funding: -1, problem: 0, bowner: -1, relaunch: -1, collision: -1, governance: 0, urgency: -1 },
      notes: "Everyone agrees it should happen, nobody has put their name on it. Classic zombie signature, park until a sponsor exists.",
      status: "assessed"
    })
  ];
}

/* ============================================================
   UI ATOMS
   ============================================================ */
const { useState, useEffect, useMemo, useRef } = React;

const VCOLOR = { proceed:"var(--proceed)", caution:"var(--caution)", hold:"var(--hold)", reject:"var(--reject)" };

function Dial({ value, color }){
  const r = 36, c = 2 * Math.PI * r;
  const frac = Math.max(0, Math.min(1, (value - 1) / 4));
  return (
    <div className="dial">
      <svg width="88" height="88" viewBox="0 0 88 88">
        <circle cx="44" cy="44" r={r} fill="none" stroke="var(--surface-2)" strokeWidth="8" />
        <circle cx="44" cy="44" r={r} fill="none" stroke={color} strokeWidth="8" strokeLinecap="round"
          strokeDasharray={c} strokeDashoffset={c * (1 - frac)} />
      </svg>
      <div className="num"><b style={{ color }}>{value.toFixed(1)}</b><small>OF 5</small></div>
    </div>
  );
}

function Likert({ value, onChange }){
  return (
    <div className="lik">
      {[0,1,2,3,4].map(n => (
        <button key={n} type="button" className={value === n ? "on" : ""} onClick={() => onChange(n)}>{n}</button>
      ))}
    </div>
  );
}

function Tri({ value, onChange }){
  const opts = [
    { v: 1,  cls: "pos", t: "Positive" },
    { v: 0,  cls: "neu", t: "Neutral" },
    { v: -1, cls: "con", t: "Concerning" }
  ];
  return (
    <div className="tri">
      {opts.map(o => (
        <button key={o.v} type="button" className={o.cls + (value === o.v ? " on" : "")} onClick={() => onChange(o.v)}>{o.t}</button>
      ))}
    </div>
  );
}

function Card({ tag, title, right, children }){
  return (
    <div className="card">
      <div className="card-h">
        <h3>{title}</h3>
        <div className="row" style={{ gap: 8 }}>
          {right}
          {tag ? <span className="block-tag">{tag}</span> : null}
        </div>
      </div>
      <div className="card-b">{children}</div>
    </div>
  );
}

function StatusChip({ m }){
  return <span className={"chip " + m.verdict.cls}>{m.verdict.label}</span>;
}

/* ============================================================
   ASSESS VIEW (Blocks A-G, live gate verdict)
   ============================================================ */
function AssessView({ draft, setDraft, onSave, onDelete, isNew, toast }){
  const m = useMemo(() => metrics(draft), [draft]);
  const det = useMemo(() => detectArchetype((draft.name || "") + " " + (draft.summary || "")), [draft.name, draft.summary]);
  const set = (k, v) => setDraft(d => Object.assign({}, d, { [k]: v }));
  const setDim = (k, v) => setDraft(d => Object.assign({}, d, { dims: Object.assign({}, d.dims, { [k]: v }) }));
  const setRead = (k, v) => setDraft(d => Object.assign({}, d, { read: Object.assign({}, d.read, { [k]: v }) }));
  const setSig = (k, v) => setDraft(d => Object.assign({}, d, { sigs: Object.assign({}, d.sigs, { [k]: v }) }));
  const toggleFlag = (id) => setDraft(d => {
    const has = (d.flags || []).includes(id);
    return Object.assign({}, d, { flags: has ? d.flags.filter(x => x !== id) : [...(d.flags || []), id] });
  });
  const setGap = (i, k, v) => setDraft(d => {
    const gaps = d.gaps.map((g, j) => j === i ? Object.assign({}, g, { [k]: v }) : g);
    return Object.assign({}, d, { gaps });
  });
  const addGap = () => setDraft(d => Object.assign({}, d, { gaps: [...(d.gaps || []), { req: "", plan: "", blocker: false }] }));
  const rmGap = (i) => setDraft(d => Object.assign({}, d, { gaps: d.gaps.filter((_, j) => j !== i) }));
  const archLabel = id => (ARCHETYPES.find(a => a.id === id) || {}).label || "";

  return (
    <div className="assess-grid">
      <div className="stack">

        <Card tag="BLOCK A" title="Change summary">
          <div className="grid2">
            <div>
              <label className="f-label">Initiative name</label>
              <input className="f-input" value={draft.name} onChange={e => set("name", e.target.value)} placeholder="e.g. Product Catalogue Consolidation" />

              <label className="f-label">Horizon</label>
              <select className="f-select" value={draft.horizon} onChange={e => set("horizon", e.target.value)}>

          </div>
          <div style={{ marginTop: 12 }}>
            <label className="f-label">One-paragraph summary (TL;DR)</label>

            <div className="arch-hint">
              {det.primary
                ? <span>Detected archetype: <b>{det.primary.label}</b>{det.secondary ? <span>, hybrid with <b>{det.secondary.label}</b></span> : null}.{" "}
                    {draft.archetype !== det.primary.id
                      ? <button className="btn ghost sm" type="button" onClick={() => { set("archetype", det.primary.id); if (det.secondary) set("archetype2", det.secondary.id); }}>Use detection</button>
                      : <span>Applied.</span>}
                  </span>
                : <span>Write the summary and the archetype detector will classify it, or pick one below.</span>}
            </div>
          </div>
          <div style={{ marginTop: 12 }}>
            <label className="f-label">Archetype</label>
            <div className="arch">
              {ARCHETYPES.map(a => (
                <button key={a.id} type="button" className={draft.archetype === a.id ? "on" : ""} onClick={() => set("archetype", draft.archetype === a.id ? "" : a.id)}>{a.label}</button>
              ))}

            {draft.archetype2 ? <div className="arch-hint">Hybrid secondary: <b>{archLabel(draft.archetype2)}</b></div> : null}

        <Card tag="BLOCK B" title="Capability match and gaps" right={<button className="btn sm" type="button" onClick={addGap}>+ Add gap</button>}>
          <p className="f-hint" style={{ marginTop: 0, marginBottom: 12 }}>
            Map each requirement to evidence the organisation actually has. For every gap: is it a hard blocker, can adjacent capability cover it, and what is the concrete mitigation?
          </p>
          <div className="stack" style={{ gap: 10 }}>
            {(draft.gaps || []).length === 0 ? <div className="empty" style={{ padding: "16px 10px" }}>No gaps logged. Either this is unusually well-shaped or Block B has not been done yet.</div> : null}
            {(draft.gaps || []).map((g, i) => (
              <div className="gap-item" key={i}>
                <div className="g-top">
                  <input className="f-input" value={g.req} onChange={e => setGap(i, "req", e.target.value)} placeholder="Requirement or capability needed" />
                  <button type="button" className={"btn sm " + (g.blocker ? "danger" : "ghost")} onClick={() => setGap(i, "blocker", !g.blocker)}>{g.blocker ? "Hard blocker" : "Mitigable"}</button>
                  <button type="button" className="btn ghost sm" onClick={() => rmGap(i)} aria-label="Remove gap">✕</button>
                </div>
                <input className="f-input" value={g.plan} onChange={e => setGap(i, "plan", e.target.value)} placeholder="Concrete mitigation plan" />
              </div>
            ))}
          </div>
        </Card>

        <Card tag="BLOCKS C·D" title="Weighted evaluation">
          {DIMS.map(d => (
            <div className="dim" key={d.id}>
              <div className="dim-top">
                <b>{d.label}<span className="w">w {Math.round(d.w * 100)}%</span></b>
                <span className="val">{Number(draft.dims[d.id]).toFixed(1)}</span>
              </div>
              <p>{d.hint}</p>
              <input type="range" min="1" max="5" step="0.1" value={draft.dims[d.id]} onChange={e => setDim(d.id, Number(e.target.value))} />
            </div>
          ))}
          <div style={{ marginTop: 14 }}>
            <label className="f-label">Red flags (each subtracts {FLAG_PENALTY} from the global score)</label>
            <div className="stack" style={{ gap: 7 }}>
              {RED_FLAGS.map(f => (
                <label className={"flag" + ((draft.flags || []).includes(f.id) ? " on" : "")} key={f.id}>
                  <input type="checkbox" checked={(draft.flags || []).includes(f.id)} onChange={() => toggleFlag(f.id)} />
                  <span>{f.label}</span>
                </label>
              ))}
            </div>
          </div>
        </Card>

        <Card tag="BLOCK D·R" title="Readiness and ownership model">
          <p className="f-hint" style={{ marginTop: 0, marginBottom: 10 }}>
            Eight statements, 0 (not at all) to 4 (completely). Six place the capability in its right home, two measure raw readiness this cycle. The recommendation updates live in the panel.
          </p>
          {READINESS_QS.map(q => (
            <div className="lik-row" key={q.id}>
              <p>{q.q}</p>
              <Likert value={Number(draft.read[q.id]) || 0} onChange={v => setRead(q.id, v)} />
            </div>
          ))}
        </Card>

        <Card tag="BLOCK G" title="Initiative legitimacy">
          <p className="f-hint" style={{ marginTop: 0, marginBottom: 10 }}>
            Is this real, sponsored, fundable change or a zombie initiative? This tier never moves the score; it is a separate read. Observations, not accusations: every signal has legitimate explanations and the owner decides.
          </p>
          {G_SIGNALS.map(s => (
            <div className="sig" key={s.id}>
              <div className="q">{s.q}<small>{s.note}</small></div>
              <span className="rel">{s.rel}</span>
              <Tri value={draft.sigs[s.id] === undefined ? null : draft.sigs[s.id]} onChange={v => setSig(s.id, v)} />
            </div>
          ))}
        </Card>

        <Card tag="BLOCK E·F" title="Shaping and engagement notes">
          <textarea className="f-area" style={{ minHeight: 110 }} value={draft.notes} onChange={e => set("notes", e.target.value)}
            placeholder="Top changes to the initiative and the case before proposing. Stakeholder objections and the response to each. What would make this a PROCEED?" />
        </Card>

      </div>

      {/* ---------- Verdict panel (signature element) ---------- */}
      <div>
        <div className={"verdict v-" + m.verdict.label}>
          <div className="v-head">
            <div className="v-gate"><span className="lamp" style={{ background: VCOLOR[m.verdict.cls], color: VCOLOR[m.verdict.cls] }}></span>{m.verdict.label}</div>
            <p className="v-sub">{m.verdict.sub}</p>
          </div>
          <div className="v-body">
            <div className="v-score">
              <Dial value={m.global} color={VCOLOR[m.verdict.cls]} />
              <div className="v-rows">
                <div className="v-row"><span>Priority index</span><b>{m.priority}</b></div>
                <div className="v-row"><span>Risk factor</span><b>{Math.round(m.riskFactor * 100)}%</b></div>
                <div className="v-row"><span>Readiness</span><b>{m.readiness100}%</b></div>
                <div className="v-row"><span>Red flags</span><b>{m.flags}</b></div>
                <div className="v-row"><span>Archetype</span><b>{(ARCHETYPES.find(a => a.id === draft.archetype) || {}).label || "Unclassified"}</b></div>
              </div>
            </div>

            <div className="model-rec">
              <div className="mr-top"><span className="mr-chip">model {m.rec.model}</span><b>{m.rec.ownership}</b></div>
              <p>{m.rec.why} {m.rec.blurb}</p>
            </div>

            <div className={"tier " + m.tier.cls}>
              <b>{m.tier.label}</b>
              {m.tier.sub} {m.tier.answered < G_SIGNALS.length ? "(" + (G_SIGNALS.length - m.tier.answered) + " signal(s) unanswered)" : ""}
            </div>

            <div className="v-band">
              <b>Gate bands:</b> 4.5+ proceed · 4.0 to 4.4 caution · 3.5 to 3.9 hold · below 3.5 reject. The legitimacy tier sits outside the score on purpose.
            </div>

            <div className="row" style={{ gap: 8 }}>
              <button className="btn primary" type="button" onClick={onSave} style={{ flex: 1, justifyContent: "center" }}>{isNew ? "Save to pipeline" : "Save changes"}</button>
              {!isNew ? <button className="btn danger sm" type="button" onClick={onDelete}>Delete</button> : null}
            </div>
            <div className="v-row"><span>Status</span>
              <select className="status-sel" value={draft.status} onChange={e => set("status", e.target.value)}>
                {STATUSES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   PIPELINE VIEW (tracker with canonical statuses)
   ============================================================ */
function PipelineView({ list, onOpen, onNew, onStatus, onExport, onImport }){
  const rows = useMemo(() => list.map(c => ({ c, m: metrics(c) })).sort((a, b) => b.m.priority - a.m.priority), [list]);
  const fileRef = useRef(null);
  const counts = STATUSES.map(s => ({ s, n: list.filter(c => c.status === s.id).length }));
  return (
    <div>
      <div className="funnel">
        {counts.map(({ s, n }) => (
          <div className={"fn" + (n > 0 && s.group === "positive" ? " hot" : "")} key={s.id} title={s.desc}>
            <b>{n}</b><span>{s.label}</span>
          </div>
        ))}
      </div>
      <div className="card">
        <div className="card-h">
          <h3>Tracked initiatives</h3>
          <div className="row" style={{ gap: 8 }}>
            <button className="btn ghost sm" type="button" onClick={onExport}>Export JSON</button>
            <button className="btn ghost sm" type="button" onClick={() => fileRef.current && fileRef.current.click()}>Import</button>
            <input ref={fileRef} type="file" accept="application/json" style={{ display: "none" }}
              onChange={e => { const f = e.target.files[0]; if (f) onImport(f); e.target.value = ""; }} />
            <button className="btn primary sm" type="button" onClick={onNew}>+ New assessment</button>
          </div>
        </div>
        <div className="card-b" style={{ padding: 0, overflowX: "auto" }}>
          {rows.length === 0 ? (
            <div className="empty"><b>Nothing tracked yet.</b><br />Every assessed initiative gets registered here, no exceptions. Start with a new assessment.</div>
          ) : (
            <table className="tbl">
              <thead><tr>
                <th>#</th><th>Initiative</th><th>Score</th><th>Verdict</th><th>Model</th><th>Legitimacy</th><th>Status</th><th>Updated</th>
              </tr></thead>
              <tbody>
                {rows.map(({ c, m }) => (
                  <tr key={c.id} className="click" onClick={e => { if (e.target.tagName !== "SELECT" && e.target.tagName !== "OPTION") onOpen(c.id); }}>
                    <td className="t-num">{String(c.num).padStart(3, "0")}</td>
                    <td className="t-name">{c.name || "Untitled"}<small>{c.sponsor || "No sponsor"} · {(ARCHETYPES.find(a => a.id === c.archetype) || {}).label || "Unclassified"}</small></td>
                    <td><span className="t-score" style={{ color: VCOLOR[m.verdict.cls] }}>{m.global.toFixed(1)}</span></td>
                    <td><StatusChip m={m} /></td>
                    <td className="t-num">{m.rec.ownership} · {m.rec.model}</td>
                    <td><span className={"chip " + (m.tier.cls === "high" ? "proceed" : m.tier.cls === "susp" ? "reject" : "caution")}>{m.tier.label}</span></td>
                    <td>
                      <select className="status-sel" value={c.status} onClick={e => e.stopPropagation()} onChange={e => onStatus(c.id, e.target.value)}>
                        {STATUSES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
                      </select>
                    </td>
                    <td className="t-num">{c.updated}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   PATTERNS VIEW (portfolio pattern detector)
   ============================================================ */
function PatternsView({ list }){
  const P = useMemo(() => analysePatterns(list), [list]);
  if (P.short !== undefined){
    return (
      <div className="card"><div className="card-b">
        <div className="empty">
          <b>Not enough data yet: {P.short}/{P.need} initiatives have progressed beyond assessment.</b><br />
          Keep assessing and deciding; come back when more outcomes exist to analyse. Patterns from fewer than five decided cases are noise wearing a suit.
        </div>
      </div></div>
    );
  }
  const grLabel = { positive: "Positive", negative: "Negative", self: "Self-filtered", pending: "Pending" };
  const maxFn = Math.max(1, ...P.funnel.map(f => f.n));
  const maxFlag = Math.max(1, ...(P.flagRows.map(r => r.n)));
  return (
    <div className="stack">
      <div className="stat-strip">
        <div className="stat"><b>{P.total}</b><span>Tracked</span></div>
        <div className="stat"><b>{P.progressed}</b><span>Progressed</span></div>
        <div className="stat"><b style={{ color: "var(--proceed)" }}>{(P.scoreComparison.find(x => x.gr === "positive") || {}).n || 0}</b><span>Positive outcomes</span></div>
        <div className="stat"><b style={{ color: "var(--teal)" }}>{P.floor !== null ? P.floor.toFixed(1) : "n/a"}</b><span>Evidence score floor</span></div>
      </div>

      <Card title="Conversion funnel">
        {P.funnel.map(({ s, n }) => (
          <div className="bar-row" key={s.id}>
            <div className="lab">{s.label}</div>
            <div className="bar"><i style={{ width: (100 * n / maxFn) + "%" }}></i></div>
            <div className="n">{n} · {P.total ? Math.round(100 * n / P.total) : 0}%</div>
          </div>
        ))}
      </Card>

      <Card title="Score against outcome">
        <table className="tbl">
          <thead><tr><th>Outcome</th><th>Avg</th><th>Min</th><th>Max</th><th>N</th></tr></thead>
          <tbody>
            {P.scoreComparison.map(x => (
              <tr key={x.gr}>
                <td>{grLabel[x.gr]}</td>
                <td className="t-num">{x.n ? x.avg.toFixed(2) : "–"}</td>
                <td className="t-num">{x.n ? x.min.toFixed(1) : "–"}</td>
                <td className="t-num">{x.n ? x.max.toFixed(1) : "–"}</td>
                <td className="t-num">{x.n}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </Card>

      {P.archRows.length ? (
        <Card title="Archetype performance">
          {P.archRows.map(r => (
            <div className="bar-row" key={r.a.id}>
              <div className="lab">{r.a.label}</div>
              <div className="bar"><i style={{ width: (r.conv === null ? 0 : r.conv) + "%", background: r.conv === 0 ? "var(--reject)" : "var(--teal)" }}></i></div>
              <div className="n">{r.conv === null ? "pending" : r.conv + "%"} · {r.total}</div>
            </div>
          ))}
        </Card>
      ) : null}

      {P.flagRows.length ? (
        <Card title="Red flag frequency">
          {P.flagRows.map(r => (
            <div className="bar-row" key={r.f.id}>
              <div className="lab" style={{ flexBasis: 260 }}>{r.f.label}</div>
              <div className="bar"><i style={{ width: (100 * r.n / maxFlag) + "%", background: "var(--reject)" }}></i></div>
              <div className="n">{r.n}</div>
            </div>
          ))}
        </Card>
      ) : null}

      <Card title="Recommendations">
        {P.recs.map((r, i) => (
          <div className="reco" key={i}>
            <span className={"imp " + r.imp}>{r.imp === "hi" ? "HIGH" : r.imp === "med" ? "MED" : "LOW"}</span>
            <div><p>{r.p}</p><small>{r.s}</small></div>
          </div>
        ))}
      </Card>
    </div>
  );
}

/* ============================================================
   METHOD VIEW
   ============================================================ */
function MethodView(){
  return (
    <div className="stack method">
      <Card title="What this is">
        <p><b style={{ color: "var(--teal)" }}>Change-Ops</b> does for business change what career-ops does for job offers: a weighted evaluation with a hard gate, a legitimacy read kept deliberately outside the score, a tracked pipeline with canonical statuses, and pattern analysis across the portfolio once enough outcomes exist. Same skeleton, retargeted domain.</p>
        <h4>Block mapping</h4>
        <table>
          <thead><tr><th>career-ops</th><th>Change-Ops</th></tr></thead>
          <tbody>
            <tr><td>A · Role summary and archetype</td><td>A · Change summary and archetype (six change types, hybrids allowed)</td></tr>
            <tr><td>B · Match with CV, gaps and mitigations</td><td>B · Capability match, gaps with hard-blocker triage and concrete mitigations</td></tr>
            <tr><td>C-D · Level, strategy, comp and demand</td><td>C-D · Weighted evaluation: strategic fit, capability, benefits, readiness, risk, minus red flags</td></tr>
            <tr><td>E-F · Customisation and interview plan</td><td>E-F · Shaping and engagement notes</td></tr>
            <tr><td>G · Posting legitimacy (ghost jobs)</td><td>G · Initiative legitimacy (zombie change), separate from the score</td></tr>
          </tbody>
        </table>
        <h4>Gate bands</h4>
        <p>4.5 and above: PROCEED, mobilise now. 4.0 to 4.4: CAUTION, proceed with conditions. 3.5 to 3.9: HOLD, pursue only with a specific reason. Below 3.5: REJECT in current form. The bands are the same 1-5 interpretation career-ops applies to offers; the discipline is in not negotiating with them after the fact.</p>
        <h4>Ownership models (readiness sub-assessment)</h4>
        <table>
          <thead><tr><th>Model</th><th>Home</th><th>When</th></tr></thead>
          <tbody>
            <tr><td>a</td><td>Independent</td><td>Differentiating, loosely coupled, the unit can own it end to end and needs its own pace</td></tr>
            <tr><td>b</td><td>Central-new</td><td>Several units need the same capability and entanglement is manageable: build once, expose to all</td></tr>
            <tr><td>c</td><td>Central-legacy</td><td>Deep entanglement with the core estate: extend what exists behind strangler-pattern boundaries</td></tr>
          </tbody>
        </table>
        <h4>Rules</h4>
        <ul className="rule-list">
          <li>NEVER invent benefits figures or baselines. If there is no data, say so instead of inventing.</li>
          <li>NEVER let the legitimacy tier leak into the score. They answer different questions.</li>
          <li>ALWAYS register every assessment in the pipeline, including the ones that die. The patterns need the bodies.</li>
          <li>ALWAYS name the hard blockers. A gap with no owner and no plan is a decision, not a gap.</li>
          <li>Time-to-decision beats perfection: a shaped 80% case decided this cycle outruns a perfect case decided never.</li>
        </ul>
        <h4>Data</h4>
        <p>Everything lives in this browser via localStorage under the key <b>change-ops:v1</b>; nothing leaves the device. Export JSON for backup or to move machines. In sandboxed previews without storage the app falls back to in-memory data for the session.</p>
      </Card>
    </div>
  );
}

/* ============================================================
   APP SHELL, PWA GLUE, MOUNT
   ============================================================ */
const NAV = [
  { id: "pipeline", label: "Pipeline", k: "P" },
  { id: "assess",   label: "Assess",   k: "A" },
  { id: "patterns", label: "Patterns", k: "T" },
  { id: "method",   label: "Method",   k: "M" }
];

function App(){
  const [list, setList] = useState(() => {
    const saved = store.get(LS_KEY, null);
    return (saved && Array.isArray(saved.list) && saved.list.length) ? saved.list : seed();
  });
  const [tab, setTab] = useState("pipeline");
  const [draft, setDraft] = useState(null);
  const [isNew, setIsNew] = useState(false);
  const [toastMsg, setToastMsg] = useState(null);
  const [installEvt, setInstallEvt] = useState(null);

  useEffect(() => { store.set(LS_KEY, { list, savedAt: Date.now() }); }, [list]);
  useEffect(() => {
    const h = (e) => { e.preventDefault(); setInstallEvt(e); };
    window.addEventListener("beforeinstallprompt", h);
    window.addEventListener("appinstalled", () => setInstallEvt(null));
    return () => window.removeEventListener("beforeinstallprompt", h);
  }, []);

  const toast = (m) => { setToastMsg(m); setTimeout(() => setToastMsg(null), 2200); };
  const nextNum = () => list.reduce((mx, c) => Math.max(mx, c.num || 0), 0) + 1;

  const openAssess = (id) => {
    const c = list.find(x => x.id === id);
    if (!c) return;
    setDraft(JSON.parse(JSON.stringify(c)));
    setIsNew(false); setTab("assess");
  };
  const newAssess = () => { setDraft(blankInitiative(nextNum())); setIsNew(true); setTab("assess"); };
  const saveDraft = () => {
    if (!draft) return;
    const d = Object.assign({}, draft, { updated: today(), name: draft.name || "Untitled" });
    setList(L => {
      const i = L.findIndex(x => x.id === d.id);
      if (i === -1) return [...L, d];
      const copy = L.slice(); copy[i] = d; return copy;
    });
    setIsNew(false);
    toast("Registered in the pipeline. No exceptions, remember.");
  };
  const deleteDraft = () => {
    if (!draft) return;
    setList(L => L.filter(x => x.id !== draft.id));
    setDraft(null); setTab("pipeline");
    toast("Deleted.");
  };
  const setStatus = (id, status) => setList(L => L.map(c => c.id === id ? Object.assign({}, c, { status, updated: today() }) : c));
  const doExport = () => {
    const blob = new Blob([JSON.stringify({ app: "change-ops", v: 1, list }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "change-ops-" + today() + ".json";
    a.click(); URL.revokeObjectURL(a.href);
  };
  const doImport = (file) => {
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (data && Array.isArray(data.list)) { setList(data.list); toast("Imported " + data.list.length + " initiative(s)."); }
        else toast("That file is not a Change-Ops export.");
      } catch (e) { toast("Could not read that file."); }
    };
    r.readAsText(file);
  };
  const goTab = (id) => {
    if (id === "assess" && !draft) { newAssess(); return; }
    setTab(id);
  };

  const page = {
    pipeline: { h: "Pipeline", p: "Every assessment gets registered, including the dead ones. Sorted by priority index: score discounted by risk." },
    assess:   { h: draft && !isNew ? ("Assess · " + (draft.name || "Untitled")) : "New assessment", p: "Blocks A to G with a live gate verdict. The verdict panel updates as you work; save when it reflects reality." },
    patterns: { h: "Portfolio patterns", p: "What your own outcomes say about what to stop assessing, where your score floor sits, and which red flag keeps recurring." },
    method:   { h: "Method", p: "The skeleton, the bands, the models, and the rules. Read once, then argue with the data instead." }
  }[tab];

  return (
    <div className="app">
      <aside className="rail">
        <div className="brand">
          <div className="mark">Δ</div>
          <div><h1>Change-Ops</h1><small>assess · prioritise · critique</small></div>
        </div>
        {NAV.map(n => (
          <button key={n.id} className={"nav-btn" + (tab === n.id ? " on" : "")} onClick={() => goTab(n.id)}>
            {n.label}<span className="k">{n.k}</span>
          </button>
        ))}
        <div className="spacer"></div>
        <div className="rail-foot">
          {installEvt ? (
            <button className="install-hint" onClick={() => { installEvt.prompt(); }}>
              <b>Install Change-Ops</b><br />Add to your home screen as an app.
            </button>
          ) : null}
          <div className="meta"><b>{list.length}</b> tracked · data stays in this browser{store.ok ? "" : " (preview: in-memory only)"}<br />v1.0 · single file, no build step</div>
        </div>
      </aside>

      <div style={{ minWidth: 0 }}>
        <div className="topbar">
          <div className="mark">Δ</div>
          {NAV.map(n => (
            <button key={n.id} className={"tb" + (tab === n.id ? " on" : "")} onClick={() => goTab(n.id)}>{n.label}</button>
          ))}
        </div>
        <main className="main">
          <div className="page-head">
            <div>
              <div className="eyebrow">{tab === "assess" ? "Blocks A-G" : tab === "pipeline" ? "Canonical statuses" : tab === "patterns" ? "Outcome analysis" : "Operating rules"}</div>
              <h2>{page.h}</h2>
              <p>{page.p}</p>
            </div>
          </div>
          {tab === "pipeline" ? <PipelineView list={list} onOpen={openAssess} onNew={newAssess} onStatus={setStatus} onExport={doExport} onImport={doImport} /> : null}
          {tab === "assess" && draft ? <AssessView draft={draft} setDraft={setDraft} onSave={saveDraft} onDelete={deleteDraft} isNew={isNew} toast={toast} /> : null}
          {tab === "patterns" ? <PatternsView list={list} /> : null}
          {tab === "method" ? <MethodView /> : null}
        </main>
      </div>
      {toastMsg ? <div className="toast">{toastMsg}</div> : null}
    </div>
  );
}

/* ---- PWA: blob manifest + canvas icon, harmless where unsupported ---- */
(function pwa(){
  try {
    const cv = document.createElement("canvas"); cv.width = 192; cv.height = 192;
    const x = cv.getContext("2d");
    const g = x.createRadialGradient(60, 60, 10, 96, 96, 140);
    g.addColorStop(0, "#2DD4BF"); g.addColorStop(1, "#0E4D45");
    x.fillStyle = "#0B1220"; x.fillRect(0, 0, 192, 192);
    x.fillStyle = g;
    x.beginPath();
    if (x.roundRect) { x.roundRect(20, 20, 152, 152, 36); } else { x.rect(20, 20, 152, 152); }
    x.fill();
    x.fillStyle = "#05201C"; x.font = "700 96px 'Space Grotesk', sans-serif";
    x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("\u0394", 96, 104);
    const icon = cv.toDataURL("image/png");
    const manifest = {
      name: "Change-Ops", short_name: "Change-Ops",
      start_url: ".", display: "standalone",
      background_color: "#0B1220", theme_color: "#0B1220",
      icons: [{ src: icon, sizes: "192x192", type: "image/png" }]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
    const link = document.createElement("link");
    link.rel = "manifest"; link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
    const touch = document.createElement("link");
    touch.rel = "apple-touch-icon"; touch.href = icon;
    document.head.appendChild(touch);
  } catch (e) { /* preview environments without canvas: skip */ }
})();

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
